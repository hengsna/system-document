name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  build-frontend:
    name: Build Next.js Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: survey-builder/package-lock.json

      - name: Install Dependencies & Build
        run: |
          cd survey-builder
          npm install
          npm run build

  test-backend:
    name: Test Laravel Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, pdo_pgsql, zip
          tools: composer:v2

      - name: Install Dependencies
        run: |
          cd m_e_backend
          composer install --prefer-dist --no-progress
          cp .env.example .env
          php artisan key:generate

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: [build-frontend, test-backend]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.PRODUCTION_SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Deploy via SSH
        run: |
          echo "Deployment steps go here!"
          # Example: rsync -avz --exclude='.git' ./ ${{ secrets.PRODUCTION_SSH_USER }}@${{ secrets.PRODUCTION_SERVER_IP }}:/var/www/m_e_system/
